name: Auto Daily Blog Updates Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog-updates
  cancel-in-progress: false

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Latest Official Blogs
        run: pnpm exec tsx scripts/fetch/updates.ts

      - name: Fetch Latest Official Live Schedule
        run: pnpm exec tsx scripts/fetch/events.ts

      - name: Fetch Latest Member Videos
        run: pnpm exec tsx scripts/fetch/videos.ts

      - name: Validate data before commit
        run: pnpm data:validate

      - name: Commit and Push if new blogs available
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(blogs): auto-sync latest official blog updates'
          file_pattern: 'data/latest-updates.json data/portal.json data/latest-videos.json'
