name: Weekly Link Health Check

on:
  schedule:
    # Every Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Link Checks
        run: pnpm data:links

      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(links): weekly automated link health update'
          title: 'Automated Link Health Report Update'
          body: 'Automated weekly healthcheck results for Sakamichi official links.'
          branch: 'chore/link-report-update'
