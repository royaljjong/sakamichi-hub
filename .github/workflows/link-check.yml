name: Weekly Link Health Check

on:
  schedule:
    # Every Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-link-health
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Link Checks
        run: pnpm data:links

      - name: Validate data before commit
        run: pnpm data:validate

      - name: Commit link report if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(links): weekly automated link health update'
          file_pattern: 'data/link-report.json'
